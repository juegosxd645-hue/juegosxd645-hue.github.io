<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huevox del Brandom</title>
    <style>
        /* Fondo negro con luz morada palpitante en el centro */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: radial-gradient(circle at center, #2d004d 0%, #000000 70%);
            margin: 0;
            padding: 50px 20px;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            animation: brilloMorado 4s ease-in-out infinite alternate;
        }

        @keyframes brilloMorado {
            0% { background: radial-gradient(circle at center, #23003a 0%, #000000 70%); }
            100% { background: radial-gradient(circle at center, #4a007a 0%, #000000 75%); }
        }

        /* Contenedor principal */
        .container {
            background-color: rgba(20, 20, 20, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.3);
            max-width: 500px;
            margin: 0 auto;
            border: 1px solid rgba(138, 43, 226, 0.2);
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #a020f0;
            font-size: 2.5em;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(160, 32, 240, 0.6);
            margin-bottom: 20px;
        }

        /* Espacio adaptado para la nueva foto de Eminem Raid */
        .producto-img {
            width: 100%;
            max-width: 320px;
            height: auto;
            border-radius: 15px;
            margin: 20px auto;
            display: block;
            border: 3px solid #a020f0;
            box-shadow: 0 0 20px rgba(160, 32, 240, 0.5);
        }

        .precio {
            font-size: 1.6em;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
            margin: 20px 0 10px 0;
        }

        .contador-cuotas {
            font-size: 0.95em;
            color: #ff4757;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 0 0 5px rgba(255, 71, 87, 0.5);
        }

        .btn-compra {
            background: linear-gradient(45deg, #a020f0, #ff4757);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(160, 32, 240, 0.4);
            width: 80%;
        }

        .btn-compra:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 25px rgba(160, 32, 240, 0.8);
        }

        .pd {
            font-style: italic;
            color: #888;
            margin-top: 40px;
            font-size: 1em;
            border-top: 1px solid #333;
            padding-top: 15px;
        }

        /* Contenedor de notificaciones de celular */
        #notification-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notificacion {
            background: rgba(30, 30, 30, 0.95);
            color: #fff;
            padding: 12px 15px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border-left: 5px solid #a020f0;
            text-align: left;
            font-size: 0.9em;
            font-family: sans-serif;
            animation: slideIn 0.4s ease-out forwards;
            opacity: 0;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { transform: translateY(-20px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>¡Huevox del Brandom!!!</h1>
        
        <!-- Imagen configurada con la foto de Eminem Raid -->
        <img src="eminem-raid.jpg" alt="Huevox del Brandom" class="producto-img">


        <p class="precio">A la venta por solo 0,89$</p>
        <div class="contador-cuotas">🔥 ¡Llevatelo hoy en 24 cuotas de 0,037$! 🔥</div>
        
        <button class="btn-compra" onclick="alert('🚨 ¡ATENCIÓN! \nHas iniciado la compra de los Huevox del Brandom.\nTu plan de financiación a 2 años ha sido activado.\n\n¡Gracias por confiar en Brandom!')">
            ¡Comprar Ahora!
        </button>
        
        <div class="pd">
            <p>Pd: Hola</p>
        </div>
    </div>

    <div id="notification-container"></div>

    <script>
        // Audio sintetizado integrado para simular el sonido del celular (así no dependés de archivos externos)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playPingSound() {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nota D5
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); // Sube a A5
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {
                console.log("El navegador bloqueó el audio hasta que interactúes con la página.");
            }
        }

        // Comentarios temáticos basados en la imagen
        const comentarios = [
            { usuario: "Juan P. ⭐⭐⭐⭐⭐", texto: "¡El Raid de Eminem me salvó de los haters! El mejor precio." },
            { usuario: "María L. ⭐⭐⭐⭐⭐", texto: "Brandom, esa foto de Eminem está genial jajaja ¡Comprado!" },
            { usuario: "Carlos M. ⭐⭐⭐⭐", texto: "Por 0.89$ a dos años es un regalo total." },
            { usuario: "Sofía G. ⭐⭐⭐⭐⭐", texto: "El efecto morado de fondo queda impecable con el diseño." },
            { usuario: "Lucas T. ⭐⭐⭐⭐⭐", texto: "Eminem aprobando las cuotas es todo lo que necesitaba ver." }
        ];

        let index = 0;

        function mostrarSiguienteNotificacion() {
            const container = document.getElementById('notification-container');
            const data = comentarios[index];
            
            const notif = document.createElement('div');
            notif.className = 'notificacion';
            notif.innerHTML = `<strong>💬 ${data.usuario}</strong><br><span style="color:#bbb;">${data.texto}</span>`;
            
            container.appendChild(notif);
            playPingSound();
            
            setTimeout(() => {
                notif.style.animation = 'fadeOut 0.4s ease-in forwards';
                setTimeout(() => { otif.remove(); }, 400);
            }, 4000);
            
            index = (index + 1) % comentarios.length;
        }

        setTimeout(mostrarSiguienteNotificacion, 2000);
        setInterval(mostrarSiguienteNotificacion, 6000);
    </script>

</body>
</html>
